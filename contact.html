<!DOCTYPE html>
<!-- Main Content Area for Contact Page -->
    <main class="contact-content">
        
        <section class="contact-hero-section">
            <!-- Left Column: Text -->
            <div class="contact-messaging">
                <h1 class="contact-headline">Full set of great features to make your product fresh</h1>
                <p>Our favorite brands are our friends! We help them to achieve their goals, they help us to stay sharp.</p>
            </div>
            
            <!-- Right Column: Form -->
            <div class="contact-form-wrapper">
                <form action="#" method="POST" class="genesis-form">
                    <div class="input-group">
                        <label for="fullName" class="visually-hidden">Name</label>
                        <input type="text" id="fullName" name="fullName" placeholder="Name">
                    </div>
                    
                    <div class="input-group">
                        <label for="emailAddress" class="visually-hidden">Email</label>
                        <input type="email" id="emailAddress" name="emailAddress" placeholder="Email">
                    </div>
                    
                    <div class="input-group">
                        <label for="messageBody" class="visually-hidden">Message</label>
                        <textarea id="messageBody" name="messageBody" placeholder="Message" rows="4"></textarea>
                    </div>
                    
                    <button type="submit" class="btn-submit">Submit</button>
                </form>
            </div>
        </section>

        <!-- Bottom Section: Map -->
        <section class="location-map">
            <img src="images/Map.png" alt="Map of Broadway Triangle and Summer Houses">
        </section>

    </main>
