<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis - Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <div class="page-container">

        <header class="genesis-top-bar">
            <div class="brand-mark">
                <a href="index.html">Genesis</a>
            </div>
            <nav class="primary-navigation">
                <ul>
                    <li><a href="index.html">Projects</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>

        <main class="contact-main">
            <div class="contact-intro">
                <h1>
                    Full set of great<br>features to make your<br>product fresh
                </h1>
                <p>
                    Our favorite brands are our friends! We help them to achieve their goals, they help us to stay sharp.
                </p>
            </div>

            <div class="contact-form-wrapper">
                <form action="#" method="POST">
                    <div class="form-group">
                        <input type="text" id="fullName" name="fullName" placeholder="Name">
                    </div>

                    <div class="form-group">
                        <input type="email" id="emailAddress" name="emailAddress" placeholder="Email">
                    </div>

                    <div class="form-group">
                        <input type="text" id="messageBody" name="messageBody" placeholder="Message">
                    </div>

                    <div>
                        <button type="submit">Submit</button>
                    </div>
                </form>
            </div>
        </main>

        <section class="map-section">
            <img src="images/Map.png" alt="Map of Broadway Triangle and Summer Houses">
        </section>

        <footer class="site-footer">
            <div class="brand-mark">
                <a href="index.html">Genesis</a>
            </div>

            <div class="footer-right">
                <nav class="footer-links">
                    <ul>
                        <li><a href="index.html">Projects</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                </nav>

                <div class="social-icons">
                    <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
                    <a href="#"><img src="images/twitter-logo-silhouette.png" alt="Twitter"></a>
                    <a href="#"><img src="images/dribbble-logo.png" alt="Dribbble"></a>
                </div>
            </div>
        </footer>

    </div>

</body>

</html>
