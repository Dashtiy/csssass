<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis - Contact</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; font-family: 'Poppins', sans-serif; background-color: #ffffff; color: #111111;">
 
  <!-- SIDOBEHÅLLARE: 1109px bred med 61px toppavstånd (enligt Figma) -->
<div style="width: 1109px; margin: 0 auto; padding-top: 61px; padding-bottom: 60px; box-sizing: border-box;">
 
    <!-- 1. HEADER (1109 x 23 px) -->
<header style="display: flex; justify-content: space-between; align-items: center; width: 1109px; height: 23px; margin-bottom: 110px;">
<a href="../index.html" style="font-weight: 600; font-size: 16px; color: #111111; text-decoration: none; letter-spacing: -0.01em;">Genesis</a>
<nav>
<ul style="display: flex; gap: 32px; list-style: none; margin: 0; padding: 0;">
<li><a href="../index.html" style="font-size: 13px; color: #111111; text-decoration: none;">Projects</a></li>
<li><a href="contact.html" style="font-size: 13px; color: #111111; text-decoration: none; font-weight: 600;">Contact</a></li>
</ul>
</nav>
</header>
 
    <!-- 2. INNEHÅLL: Text (475px) + Mellanrum (160px) + Formulär (475px) = 1110px -->
<main style="display: flex; justify-content: space-between; align-items: flex-start; width: 1109px; margin-bottom: 138px;">
<!-- VÄNSTER KOLUMN: Rubrik (475x174 px) och undertext (445x56 px) -->
<div style="width: 475px;">
<h1 style="width: 475px; height: 174px; font-size: 38px; font-weight: 600; line-height: 1.22; color: #111111; margin: 0 0 20px 0; letter-spacing: -0.02em;">
          Full set of great<br>features to make your<br>product fresh
</h1>
<p style="width: 445px; height: 56px; font-size: 13.5px; line-height: 1.6; color: #8c8c8c; margin: 0;">
          Our favorite brands are our friends! We help them to achieve their goals, they help us to stay sharp.
</p>
</div>
 
      <!-- HÖGER KOLUMN: Formulär (475x291 px) -->
<div style="width: 475px; min-height: 291px;">
<form action="#" method="POST" style="display: flex; flex-direction: column; width: 475px;">
<!-- Name -->
<div style="margin-bottom: 26px;">
<input type="text" id="fullName" name="fullName" placeholder="Name" 
                   style="width: 100%; border: none; border-bottom: 1px solid #e0e0e0; background: transparent; padding: 8px 0; font-size: 13.5px; font-family: inherit; color: #111111; outline: none; box-sizing: border-box;">
</div>
 
          <!-- Email -->
<div style="margin-bottom: 26px;">
<input type="email" id="emailAddress" name="emailAddress" placeholder="Email" 
                   style="width: 100%; border: none; border-bottom: 1px solid #e0e0e0; background: transparent; padding: 8px 0; font-size: 13.5px; font-family: inherit; color: #111111; outline: none; box-sizing: border-box;">
</div>
 
          <!-- Message -->
<div style="margin-bottom: 30px;">
<input type="text" id="messageBody" name="messageBody" placeholder="Message" 
                   style="width: 100%; border: none; border-bottom: 1px solid #e0e0e0; background: transparent; padding: 8px 0; font-size: 13.5px; font-family: inherit; color: #111111; outline: none; box-sizing: border-box;">
</div>
 
          <!-- Submit-knapp -->
<div>
<button type="submit" 
                    style="background-color: #2b38f7; color: #ffffff; border: none; padding: 11px 36px; border-radius: 4px; font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer;">
              Submit
</button>
</div>
 
        </form>
</div>
 
    </main>
 
    <!-- 3. KARTA: 1110 x 570 px (backar ett steg till images/) -->
<section style="width: 1109px; height: 570px; overflow: hidden; margin-bottom: 80px;">
<img src="../images/Map.png" alt="Map of Broadway Triangle and Summer Houses" style="width: 100%; height: 100%; object-fit: cover; display: block;">
</section>
 
    <!-- 4. FOOTER: 1110 x 23 px -->
<footer style="display: flex; justify-content: space-between; align-items: center; width: 1109px; height: 23px;">
<div>
<a href="../index.html" style="font-weight: 600; font-size: 15px; color: #111111; text-decoration: none;">Genesis</a>
</div>
 
      <div style="display: flex; align-items: center; gap: 40px;">
<nav>
<ul style="display: flex; gap: 28px; list-style: none; margin: 0; padding: 0;">
<li><a href="../index.html" style="font-size: 13px; color: #111111; text-decoration: none;">Projects</a></li>
<li><a href="contact.html" style="font-size: 13px; color: #111111; text-decoration: none;">Contact</a></li>
</ul>
</nav>
 
        <div style="display: flex; align-items: center; gap: 16px;">
<a href="#" style="display: flex; align-items: center;"><img src="../images/instagram.png" alt="Instagram" style="width: 14px; height: 14px; display: block;"></a>
<a href="#" style="display: flex; align-items: center;"><img src="../images/twitter-logo-silhouette.png" alt="Twitter" style="width: 14px; height: 14px; display: block;"></a>
<a href="#" style="display: flex; align-items: center;"><img src="../images/dribbble-logo.png" alt="Dribbble" style="width: 14px; height: 14px; display: block;"></a>
</div>
</div>
</footer>
 
  </div>
 
</body>
</html>
